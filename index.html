<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al-Huda Memories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            text-align: center;
            padding: 45px 20px 30px;
            background: white;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }

        p {
            margin-top: 10px;
            color: #777;
        }

        .gallery {
            width: 94%;
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            border-radius: 6px;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 7px;
            }

            .gallery img {
                height: 190px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>AL-HUDA MODEL COLLEGE</h1>
        <p>Our Memories</p>
    </header>

    <div class="gallery">

        <!-- Photos will be added here later -->

    </div>

</body>
</html>
